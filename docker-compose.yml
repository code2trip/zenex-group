version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenex-group-web
    ports:
      - "${HTTP_PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - zenex-network

networks:
  zenex-network:
    driver: bridge


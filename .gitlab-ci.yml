stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: registry.digitalocean.com/that-one-registry/zenex-group
  DOCKER_REGISTRY: registry.digitalocean.com
  DOCKER_DRIVER: overlay2
  DOCKER_CACHE: "$DOCKER_IMAGE:cache"
  DOCKER_TLS_CERTDIR: ""
  SSH_USER: root
  SSH_HOST: 10.10.10.151
  SSH_PORT: 22

build:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  tags:
    - linux
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_CLI_EXPERIMENTAL: "enabled"
  script:
    - echo "$DO_DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u "$DO_DOCKER_USERNAME" --password-stdin

    - |
      if docker pull $DOCKER_CACHE; then
        echo "Pulled cache image"
      else
        echo "No cache image yet"
      fi

    - docker build --tag $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA --tag $DOCKER_IMAGE:latest .
    - docker tag $DOCKER_IMAGE:latest $DOCKER_CACHE
    - docker push $DOCKER_CACHE

    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest

  only:
    - main
  timeout: 30m
  retry: 2

deploy:
  stage: deploy
  tags:
   - linux
  only:
    - main
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - |
      cat <<EOF > ~/.ssh/id_rsa
      $SSH_PRIVATE_KEY
      EOF
    - chmod 600 ~/.ssh/id_rsa
  script:
    - |
      ssh -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -i ~/.ssh/id_rsa \
          $SSH_USER@$SSH_HOST -p $SSH_PORT <<EOF
      set -eo pipefail

      echo "$DO_DOCKER_PASSWORD" | docker login $DOCKER_REGISTRY -u "$DO_DOCKER_USERNAME" --password-stdin

      if docker ps --format '{{.Names}}' | grep -qx app; then
        docker stop app
        docker rm app
        docker image rm $DOCKER_IMAGE:latest
      fi

      docker pull "$DOCKER_IMAGE:latest"

      docker run -d -p 80:80 --name app "$DOCKER_IMAGE:latest"
      EOF
